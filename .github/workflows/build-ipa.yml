name: Build FoNzEsGram (Sideloadly Ready)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Название приложения на экране iPhone'
        required: true
        default: 'FoNzEsGram'
      ipa_url:
        description: 'URL к Base IPA (по умолчанию сборка с кастомным оформлением/шейдерами)'
        required: false
        default: 'https://github.com/mapix3/AyuGram-iOS/releases/download/build-207201/AyuGram-custom-207201.ipa'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Base IPA
        run: |
          echo "Скачиваем базу..."
          curl -L -o base.ipa "${{ inputs.ipa_url }}"
          unzip -q base.ipa -d app_extracted

      - name: Customize Name, Shaders & Optimize for Sideloadly
        run: |
          APP_PATH=$(find app_extracted/Payload -maxdepth 1 -name "*.app")
          echo "Приложение: $APP_PATH"

          # 1. Меняем отображаемое название приложения на FoNzEsGram (или кастомное из поля)
          APP_NAME="${{ inputs.app_name }}"
          echo "Устанавливаем название: $APP_NAME"
          plutil -replace CFBundleDisplayName -string "$APP_NAME" "$APP_PATH/Info.plist"
          plutil -replace CFBundleName -string "$APP_NAME" "$APP_PATH/Info.plist"

          # 2. Удаляем PlugIns (расширения), чтобы Sideloadly на бесплатном Apple ID не ловил лимиты
          if [ -d "$APP_PATH/PlugIns" ]; then
            rm -rf "$APP_PATH/PlugIns"
          fi
          if [ -d "$APP_PATH/Watch" ]; then
            rm -rf "$APP_PATH/Watch"
          fi

          # 3. Пакуем готовый IPA
          cd app_extracted
          zip -qr ../FoNzEsGram_Sideloadly.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoNzEsGram_Sideloadly
          path: FoNzEsGram_Sideloadly.ipa
          retention-days: 14
