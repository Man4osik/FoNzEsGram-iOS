name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "Xcode_${XCODE_VERSION}.app not found. Available Xcodes:"
            ls -d /Applications/Xcode*.app
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
            echo "Selecting: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Restore Bazel Cache
        uses: actions/cache@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('versions.json', 'MODULE.bazel') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          # Patch plisttool to ignore mock provisioning profile expiration date
          python3 -c "
          import os
          for root, _, files in os.walk('.'):
              for f in files:
                  if f == 'plisttool.py':
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8') as fl:
                          c = fl.read()
                      if 'expire < datetime.datetime.now()' in c:
                          c = c.replace('expire < datetime.datetime.now()', 'False')
                          with open(path, 'w', encoding='utf-8') as fl:
                              fl.write(c)
                          print('Patched plisttool at:', path)
          "

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$OUTPUT_PATH/Telegram.ipa"
            cp "$f" "$OUTPUT_PATH/FoNzEsGram.ipa"
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoNzEsGram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/FoNzEsGram.ipa

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: FoNzEsGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Clean FoNzEsGram iOS build ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}) compiled from audited source.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/FoNzEsGram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
